name = "phraseo-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://phraseo.aeronautique.xyz,http://localhost:5173,http://localhost:4173"
# Quotas voix du jour (UTC), en neurones Workers AI (gratuit : 10 000/jour).
# 8 000 au total (réserve de 20 %), 800 par utilisateur (≈ 10 utilisateurs), 2 400 par IP (club, NAT)
QUOTA_USER = "800"
QUOTA_IP = "2400"
QUOTA_GLOBAL = "8000"

# 5 retours par minute et par IP
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Voix de l'ATC : 60 synthèses par minute et par IP (les répliques en cache ne comptent pas)
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# Reconnaissance vocale : 30 réponses par minute et par IP
[[ratelimits]]
name = "STT_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# Workers AI (MeloTTS, Whisper)
[ai]
binding = "AI"

# Compteur des quotas voix (SQLite, disponible sur le plan gratuit)
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "VoiceQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceQuota"]

# Secret (jamais dans ce fichier) :
#   npx wrangler secret put DISCORD_WEBHOOK_URL
