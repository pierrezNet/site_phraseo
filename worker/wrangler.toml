name = "phraseo-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://phraseo.aeronautique.xyz,http://localhost:5173,http://localhost:4173"

# 5 retours par minute et par IP
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

