name = "phraseo-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://phraseo.aeronautique.xyz,http://localhost:5173,http://localhost:4173"
# Quotas voix du jour (UTC), en unités ≈ neurones (anglais : 1,36 par caractère ; français Azure : 0,5).
# 8 000 au total : sous la gratuité Workers AI (10 000 neurones/jour) et Azure F0 (500 000 caractères/mois).
# Plus de répliques par personne plutôt que plus de personnes servies : 4 000 par utilisateur
# (≈ 30 répliques anglaises ou 80 françaises), 6 000 par IP (club, NAT)
QUOTA_USER = "4000"
QUOTA_IP = "6000"
QUOTA_GLOBAL = "8000"
# Voix française : Azure AI Speech (offre gratuite F0). Région de la ressource ; la clé est un secret :
#   npx wrangler secret put AZURE_SPEECH_KEY
AZURE_SPEECH_REGION = "francecentral"
# Collectif Open Collective du projet : fonds publics affichés dans l'appli (GET /fund)
OPEN_COLLECTIVE_SLUG = "phraseo"

# 5 retours par minute et par IP
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Voix de l'ATC : 60 synthèses par minute et par IP (les répliques en cache ne comptent pas)
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# Reconnaissance vocale : 30 réponses par minute et par IP
[[ratelimits]]
name = "STT_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# Workers AI (MeloTTS, Whisper)
[ai]
binding = "AI"

# Compteur des quotas voix (SQLite, disponible sur le plan gratuit)
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "VoiceQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceQuota"]

# Retours « J'ai un retour » : forum AvroBB, point d'entrée interne (aucune adresse publique)
[[services]]
binding = "FORUM"
service = "avrobb"
entrypoint = "PhraseoFeedback"

# Aucun secret : le relais n'a plus de webhook (les retours passent par la liaison FORUM).
